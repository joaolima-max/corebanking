name: CI

on:
  push:
    branches: [main, "claude/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Type check (API)
        run: pnpm --filter api exec tsc --noEmit

      - name: Type check (shared)
        run: pnpm --filter @bass/shared exec tsc --noEmit

      - name: Type check (Web)
        run: pnpm --filter web exec tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Run unit tests
        run: pnpm --filter api test --no-coverage

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: corebanking_test
          POSTGRES_USER: corebanking
          POSTGRES_PASSWORD: corebanking
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://corebanking:corebanking@localhost:5432/corebanking_test
      REDIS_URL: redis://localhost:6379
      JWT_PRIVATE_KEY: ""
      JWT_PUBLIC_KEY: ""
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: test
      PORT: 3000
      APP_NAME: "Bass Financial Core Test"
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 1000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Run DB migrations
        working-directory: apps/api
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://corebanking:corebanking@localhost:5432/corebanking_test

      - name: Seed database
        working-directory: apps/api
        run: npx prisma db seed
        env:
          DATABASE_URL: postgresql://corebanking:corebanking@localhost:5432/corebanking_test

      - name: Run E2E tests
        working-directory: apps/api
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgresql://corebanking:corebanking@localhost:5432/corebanking_test
