# Full-stack MVP — roda TUDO localmente (ou num VPS) com um comando.
# Local (sem cartao, sem nuvem):
#   docker compose -f docker-compose.deploy.yml up -d --build
#   docker compose -f docker-compose.deploy.yml exec api pnpm exec prisma db seed
# Abra: Core http://localhost:3002 | Wirex :3003 | Payfinex :3004  (login admin@basspago.com.br / Admin@123!)
# Num VPS, defina .env (POSTGRES_PASSWORD, NEXT_PUBLIC_API_URL, ALLOWED_ORIGINS) para sobrescrever os defaults.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corebanking}
      POSTGRES_USER: ${POSTGRES_USER:-corebanking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corebanking}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corebanking}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-corebanking}:${POSTGRES_PASSWORD:-corebanking}@postgres:5432/${POSTGRES_DB:-corebanking}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-corebanking}:${POSTGRES_PASSWORD:-corebanking}@postgres:5432/${POSTGRES_DB:-corebanking}
      REDIS_URL: redis://redis:6379
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3002,http://localhost:3003,http://localhost:3004}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - "3002:3002"
    depends_on:
      - api
    restart: unless-stopped

  finance-wirex:
    build:
      context: .
      dockerfile: apps/finance-wirex/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - "3003:3003"
    depends_on:
      - api
    restart: unless-stopped

  finance-payfinex:
    build:
      context: .
      dockerfile: apps/finance-payfinex/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - "3004:3004"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
